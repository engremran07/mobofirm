{% load allauth %}
<section class="auth-panel">
  <h2 class="auth-panel__title">{% slot title %}{% endslot %}</h2>
  {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <ul class="list-inline mt-2">
      {% for action in slots.actions %}<li class="list-inline-item">{{ action }}</li>{% endfor %}
    </ul>
  {% endif %}
</section>
