{# Contract: shop_tab (packages, account, orders). Sub-navigation shared by every shop page. #}
<nav class="subnav-ui" aria-label="Shop sections">
  <a href="{% url 'shop:pricing' %}"{% if shop_tab == 'packages' %} aria-current="page"{% endif %}>Packages</a>
  {% if user.is_authenticated %}
    <a href="{% url 'shop:my_package' %}"{% if shop_tab == 'account' %} aria-current="page"{% endif %}>My package</a>
    <a href="{% url 'shop:order_history' %}"{% if shop_tab == 'orders' %} aria-current="page"{% endif %}>My orders</a>
  {% endif %}
</nav>
