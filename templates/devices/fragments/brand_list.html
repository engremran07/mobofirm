{% if brands %}<div class="row g-3">{% for brand in brands %}<div class="col-6 col-md-4 col-xl-3"><article class="surface-card p-3"><h2 class="h5"><a href="{% url 'firmwares:brand_detail' slug=brand.slug %}">{{ brand.name }}</a></h2><p class="muted small mb-0">{{ brand.model_count|default:brand.models.count }} models</p></article></div>{% endfor %}</div>{% else %}<p class="empty-state p-4">No manufacturers match this search.</p>{% endif %}
