{% if show %}
<section class="device-os-identity surface-card p-3 my-3" data-device-os data-mode="{{ mode }}" data-device-os-enabled="{{ enabled|yesno:'true,false' }}"
         data-options-url="{% url 'devices:os_options' %}"
         data-register-url="{% url 'devices:os_register' %}"
         data-verify-url="{% url 'devices:os_verify' %}">
  {% csrf_token %}
  <h3 class="h6 mb-1">Register this device</h3>
  <p class="small muted mb-2">
    Registration requires a platform credential held by this device's operating system.
    Browser-only registration is not available. Only a public key is stored; the private key
    stays on your device.
  </p>
  <p class="small mb-2" role="status" aria-live="polite" data-device-os-status hidden></p>
  <div class="d-flex flex-wrap gap-2">
    <button type="button" class="btn btn-primary" data-device-os-action="verify" hidden>Verify this device</button>
    <button type="button" class="btn btn-primary" data-device-os-action="register" hidden>Register this device</button>
  </div>
  <noscript><p class="small muted mb-0">Enable JavaScript and use a supported device credential to register this device.</p></noscript>
</section>
{% endif %}
