{% if messages %}
  <div class="site-container pt-3" aria-live="polite">
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}"
           role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
