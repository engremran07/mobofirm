{# Django messages. Without JavaScript these are plain alerts; modules/toasts.js replaces them with toasts (data-flash carries the level). #}
{% if messages %}
  <div class="site-container pt-3" aria-live="polite" data-flash-messages>
    {% for message in messages %}
      <div class="alert alert-{% if message.level_tag == 'error' %}danger{% elif message.level_tag == 'success' %}success{% elif message.level_tag == 'warning' %}warning{% else %}info{% endif %} mb-2"
           data-flash="{% if message.level_tag == 'error' %}danger{% elif message.level_tag == 'success' %}success{% elif message.level_tag == 'warning' %}warning{% else %}info{% endif %}"
           role="{% if message.level_tag == 'error' or message.level_tag == 'warning' %}alert{% else %}status{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
