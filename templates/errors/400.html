{% extends "base.html" %}
{% block title %}Bad request | {{ site_name|default:"Mobofirm" }}{% endblock %}
{% block content %}
<div class="site-container py-5">
  <section class="surface-card allauth-shell p-4 mx-auto" aria-labelledby="error-title">
    <p class="section-eyebrow">Request error</p>
    <h1 id="error-title" class="h2">We could not process that request.</h1>
    <p>Check the submitted information and try again.</p>
    <a class="btn btn-primary" href="{% url 'home' %}">Return home</a>
  </section>
</div>
{% endblock %}
