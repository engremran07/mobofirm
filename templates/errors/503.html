{% extends "base.html" %}
{% block title %}Temporarily unavailable | {{ site_name|default:"Mobofirm" }}{% endblock %}
{% block content %}
<div class="site-container py-5">
  <section class="surface-card allauth-shell p-4 mx-auto" aria-labelledby="error-title">
    <p class="section-eyebrow">Maintenance</p>
    <h1 id="error-title" class="h2">The site is temporarily unavailable.</h1>
    <p>{{ message|default:"Please try again later." }}</p>
  </section>
</div>
{% endblock %}
