{# Contract: firmware (record with access_tier / approved_price). Compact tier badge for tables, detail and download pages. #}
{% if firmware.access_tier == "paid" %}<span class="badge tier-badge tier-badge--paid" title="Paid file">{{ firmware.tier_label }}</span>{% elif firmware.access_tier == "featured" %}<span class="badge tier-badge tier-badge--featured" title="Available to plan holders">{{ firmware.tier_label }}</span>{% else %}<span class="badge tier-badge tier-badge--free">Free</span>{% endif %}
