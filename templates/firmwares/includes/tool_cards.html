{# Contract: tools (FlashingTool list). Flashing tool cards. #}
<div class="card-grid">
  {% for tool in tools %}
    <article class="card-ui card-ui--tool">
      <div class="card-ui__body">
        <span class="card-ui__eyebrow">{{ tool.get_platform_display }}{% if tool.get_risk_level_display %} · {{ tool.get_risk_level_display }}{% endif %}</span>
        <h3 class="card-ui__title"><a class="card-ui__link" href="{% url 'firmwares:flashing_tool_detail' slug=tool.slug %}">{{ tool.name }}</a></h3>
        <p class="card-ui__text">{{ tool.description|truncatewords:20 }}</p>
      </div>
    </article>
  {% endfor %}
</div>
