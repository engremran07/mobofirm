{# Contract: guide (post, template, brand, optional model). One flashing guide card. #}
<article class="card-ui card-ui--article">
  <div class="card-ui__body">
    <span class="card-ui__eyebrow">{{ guide.template.get_guide_type_display }}</span>
    <h3 class="card-ui__title"><a class="card-ui__link" href="{{ guide.post.get_absolute_url }}">{{ guide.post.title }}</a></h3>
    <p class="card-ui__text">{{ guide.brand.name }}{% if guide.model %} · {{ guide.model.name }}{% endif %}</p>
  </div>
</article>
