{# Contract: wallet_tab (overview, ledger, earn, spend, topup, payouts). Sub-navigation shared by every wallet page. #}
<nav class="subnav-ui" aria-label="Wallet sections">
  <a href="{% url 'wallet:dashboard' %}"{% if wallet_tab == 'overview' %} aria-current="page"{% endif %}>Overview</a>
  <a href="{% url 'wallet:ledger' %}"{% if wallet_tab == 'ledger' %} aria-current="page"{% endif %}>History</a>
  <a href="{% url 'wallet:earn' %}"{% if wallet_tab == 'earn' %} aria-current="page"{% endif %}>Ways to earn</a>
  <a href="{% url 'wallet:spend' %}"{% if wallet_tab == 'spend' %} aria-current="page"{% endif %}>Ways to spend</a>
  {% if cfg.topups_enabled %}<a href="{% url 'wallet:topup' %}"{% if wallet_tab == 'topup' %} aria-current="page"{% endif %}>Top up</a>{% endif %}
  {% if cfg.payouts_enabled %}<a href="{% url 'wallet:payouts' %}"{% if wallet_tab == 'payouts' %} aria-current="page"{% endif %}>Payouts</a>{% endif %}
</nav>
