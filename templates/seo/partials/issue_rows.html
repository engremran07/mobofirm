{% for issue in issues %}
  <tr>
    <td>{{ issue.severity }}</td>
    <td>{{ issue.code }}</td>
    <td><a href="{% url 'seo:inspect' %}?url={{ issue.url|urlencode }}">{{ issue.url|default:"(site-wide)" }}</a></td>
    <td>{{ issue.message }}</td>
  </tr>
{% empty %}
  <tr><td colspan="4">No open issues match.</td></tr>
{% endfor %}
