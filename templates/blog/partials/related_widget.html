<div class="row g-3">
  {% for related_post in posts %}
    <div class="col-12 col-md-6">
      <article class="surface-card p-3 h-100">
        <h3 class="h5"><a href="{{ related_post.get_absolute_url }}">{{ related_post.title }}</a></h3>
        <p class="muted mb-0">{{ related_post.summary|truncatewords:24 }}</p>
      </article>
    </div>
  {% empty %}
    <p class="muted">No related articles are available.</p>
  {% endfor %}
</div>
