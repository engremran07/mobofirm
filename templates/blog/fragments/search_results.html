{% if query %}<h2 class="h5 mb-3">Results for “{{ query }}”</h2>{% endif %}
{% if results %}
  <div class="d-grid gap-3">
    {% for post in results %}
      <article class="surface-card p-3">
        <h3 class="h5"><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>
        <p class="muted mb-0">{{ post.summary|truncatewords:30 }}</p>
      </article>
    {% endfor %}
  </div>
{% elif query %}
  <p class="empty-state p-3 mb-0">No articles matched this search.</p>
{% endif %}
