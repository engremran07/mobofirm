{# Contract: contributions_tab (hub, firmware, blog, downloads, quota). Sub-navigation shared by every My contributions page. #}
<nav class="d-flex flex-wrap gap-2 mb-4" aria-label="My contributions sections">
  <a class="btn btn-sm {% if contributions_tab == 'hub' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'contributions:hub' %}"{% if contributions_tab == 'hub' %} aria-current="page"{% endif %}><i class="icon" data-lucide="folder" aria-hidden="true"></i> Overview</a>
  <a class="btn btn-sm {% if contributions_tab == 'firmware' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'contributions:firmware' %}"{% if contributions_tab == 'firmware' %} aria-current="page"{% endif %}><i class="icon" data-lucide="upload" aria-hidden="true"></i> Firmware contributions</a>
  <a class="btn btn-sm {% if contributions_tab == 'blog' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'contributions:blog' %}"{% if contributions_tab == 'blog' %} aria-current="page"{% endif %}><i class="icon" data-lucide="upload" aria-hidden="true"></i> Blog contributions</a>
  <a class="btn btn-sm {% if contributions_tab == 'downloads' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'contributions:downloads' %}"{% if contributions_tab == 'downloads' %} aria-current="page"{% endif %}><i class="icon" data-lucide="download" aria-hidden="true"></i> Downloads</a>
  <a class="btn btn-sm {% if contributions_tab == 'quota' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'contributions:quota' %}"{% if contributions_tab == 'quota' %} aria-current="page"{% endif %}><i class="icon" data-lucide="gauge" aria-hidden="true"></i> Quota</a>
