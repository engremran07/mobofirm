{% extends "base.html" %}
{% block title %}Device verification | {{ site_name|default:"Mobofirm" }}{% endblock %}
{% block content %}
<div class="site-container py-5"><section class="surface-card auth-card p-4">
  <p class="section-eyebrow">Account security</p><h1 class="h2">Verify this device</h1>
  <p>Enter the verification code from your configured authenticator.</p>
  <form method="post">{% csrf_token %}<label class="form-label" for="mfa-code">Verification code</label>
    <input class="form-control mb-3" id="mfa-code" name="code" inputmode="numeric" autocomplete="one-time-code" required>
    <button class="btn btn-primary" type="submit">Verify</button>
  </form>
</section></div>
{% endblock %}
