<div class="c-meter console-staff-meter">
  <div class="c-meter__head"><label class="c-meter__label" for="{{ ident }}">{{ label }}</label><span class="c-meter__caption">{{ caption }}</span></div>
  <meter class="c-meter__bar" id="{{ ident }}" min="0" max="100" low="{{ low }}" high="{{ high }}" optimum="0" value="{{ value }}">{{ value }}%</meter>
</div>
