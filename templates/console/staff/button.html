{% if kind == "dialog-link" %}<a class="{{ css }}" href="{{ dialog_url }}" hx-get="{{ dialog_url }}" hx-target="#console-dialog" hx-swap="innerHTML"{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}>{{ label }}</a>
{% elif kind == "dialog-button" %}<button type="submit" class="{{ css }}" formaction="{{ dialog_url }}" hx-get="{{ dialog_url }}" hx-include="{{ include }}" hx-target="#console-dialog" hx-swap="innerHTML"{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}>{{ label }}</button>
{% elif kind == "link" %}<a class="{{ css }}" href="{{ href }}"{% if hx_target %} hx-get="{{ href }}" hx-target="{{ hx_target }}" hx-swap="innerHTML"{% if hx_push_url %} hx-push-url="true"{% endif %}{% endif %}{% if target == "_blank" %} target="_blank" rel="noopener"{% endif %}{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}>{{ label }}</a>
{% else %}<button type="submit" class="{{ css }}"{% if name %} name="{{ name }}" value="{{ value }}"{% endif %}{% if form %} form="{{ form }}"{% endif %}{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}>{{ label }}</button>{% endif %}
