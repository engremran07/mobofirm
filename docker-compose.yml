# Production topology: web (gunicorn) + worker + beat (Celery) + PostgreSQL + Redis
# behind nginx. Copy .env.example to .env and fill in the production values first.
# The application is never exposed directly; only nginx publishes ports.
name: mobofirm

x-app: &app
  build:
    context: .
    args:
      # export APP_GIT_SHA=$(git rev-parse --short=7 HEAD) APP_BUILD_DATE=$(date -u +%F)
      APP_GIT_SHA: ${APP_GIT_SHA:-}
      APP_BUILD_DATE: ${APP_BUILD_DATE:-}
  image: mobofirm:latest
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: app.settings.production
    DB_HOST: db
    DB_PORT: "5432"
    CACHE_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    LOG_DIR: /app/logs
    TRUSTED_PROXY_COUNT: "1"
  volumes:
    - media:/app/media
    - storage:/app/storage
    - staticfiles:/app/staticfiles
    - logs:/app/logs
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-mobofirm}
      POSTGRES_USER: ${DB_USER:-mobofirm_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    # Shared by the Celery broker (db 0) and the Django cache (db 1): tasks must
    # never be evicted, and cache keys carry their own TTLs.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    command: ["gunicorn", "-c", "deploy/gunicorn.conf.py", "app.wsgi:application"]
    environment:
      <<: *app-env
      # Static files are collected into the volume nginx serves. Migrations are
      # run explicitly with the "ops" profile, never implicitly on start.
      RUN_COLLECTSTATIC: "true"

  worker:
    <<: *app
    command: ["celery", "-A", "app", "worker", "--loglevel", "INFO", "--concurrency", "${CELERY_CONCURRENCY:-2}"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  beat:
    <<: *app
    command: ["celery", "-A", "app", "beat", "--loglevel", "INFO", "--schedule", "/app/celerybeat/celerybeat-schedule"]
    volumes:
      - media:/app/media
      - storage:/app/storage
      - logs:/app/logs
      - celerybeat:/app/celerybeat

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/mobofirm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_params.inc:/etc/nginx/conf.d/proxy_params.inc:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - staticfiles:/srv/mobofirm/staticfiles:ro
      - media:/srv/mobofirm/media:ro
      - storage:/srv/mobofirm/storage:ro
    restart: unless-stopped

  # One-off operations (not started by `docker compose up`):
  #   docker compose --profile ops run --rm migrate
  #   docker compose --profile ops run --rm bootstrap
  migrate:
    <<: *app
    profiles: ["ops"]
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]

  bootstrap:
    <<: *app
    profiles: ["ops"]
    restart: "no"
    command: ["python", "manage.py", "bootstrap_site"]

volumes:
  pgdata:
  redisdata:
  media:
  storage:
  staticfiles:
  logs:
  celerybeat:
