upstream mobofirm_app {
    server web:8000;
    keepalive 16;
}

# Brute-force brake in front of the application's own per-account limiters.
limit_req_zone $binary_remote_addr zone=mobofirm_auth:10m rate=10r/m;

server_tokens off;

server {
    listen 80;
    server_name _;

    # Orchestrator probes stay on plain HTTP; everything else upgrades to HTTPS.
    location /health/ {
        proxy_pass http://mobofirm_app;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificates are mounted at ./deploy/certs (never committed).
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Firmware uploads are bounded by the firmware upload size limit.
    client_max_body_size 512m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Public, fingerprinted frontend assets collected by `collectstatic`.
    location /static/ {
        alias /srv/mobofirm/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public uploads only (logos, post images). Firmware binaries are never here.
    location /media/ {
        alias /srv/mobofirm/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # Firmware downloads: Django authorises the request, then hands the file to
    # nginx with X-Accel-Redirect. These locations are unreachable from clients.
    location /protected-media/ {
        internal;
        alias /srv/mobofirm/media/;
    }

    location /protected-storage/ {
        internal;
        alias /srv/mobofirm/storage/;
    }

    location ~ ^/(users/(login|signup|mfa)|accounts/|admin/login) {
        limit_req zone=mobofirm_auth burst=15 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_pass http://mobofirm_app;
    }

    location / {
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_pass http://mobofirm_app;
    }
}
