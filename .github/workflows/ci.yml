name: Django CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.12"
          cache: npm
      - name: Create project virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: .venv/bin/python -m pip install -e ".[dev]"
      - name: Check Python formatting
        run: .venv/bin/ruff format --check .
      - name: Check Python diagnostics
        run: .venv/bin/python -m pylint --enable=all --fail-on=E,F,W,R,C,I app apps tests scripts manage.py
      - name: Validate release metadata
        run: .venv/bin/python scripts/release.py check
      - name: Generate application implementation map
        run: .venv/bin/python scripts/application_map.py --output "$RUNNER_TEMP/application-map.json"
      - name: Upload application implementation map
        uses: actions/upload-artifact@v4.6.2
        with:
          name: application-map
          path: ${{ runner.temp }}/application-map.json
          retention-days: 7
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Install Chromium for browser checks
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Run test suite
        run: .venv/bin/python -m pytest -q
      - name: Run Django system checks
        run: .venv/bin/python manage.py check --settings=app.settings.test
      - name: Run Django deployment checks against production settings
        run: |
          export DJANGO_SECRET_KEY="$(.venv/bin/python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export MFA_ENCRYPTION_KEY="$(.venv/bin/python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SOCIAL_CREDENTIAL_ENCRYPTION_KEY="$(.venv/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export DB_PASSWORD=ci-only DJANGO_ALLOWED_HOSTS=ci.example.org SITE_URL=https://ci.example.org
          export CACHE_URL=redis://localhost:6379/1 CELERY_BROKER_URL=redis://localhost:6379/0
          export EMAIL_HOST=smtp.example.org DEFAULT_FROM_EMAIL=noreply@example.org
          .venv/bin/python manage.py check --deploy --fail-level WARNING --settings=app.settings.production
      - name: Check migration consistency
        run: .venv/bin/python manage.py makemigrations --check --dry-run --settings=app.settings.test
      - name: Check installed dependencies
        run: .venv/bin/python -m pip check
      - name: Audit Python dependencies
        run: .venv/bin/pip-audit
      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Build the production image (no push)
        run: |
          docker build --tag mobofirm:ci \
            --build-arg APP_GIT_SHA="${GITHUB_SHA::7}" \
            --build-arg APP_BUILD_DATE="$(date -u +%F)" .
      - name: Check the image reports the release version
        run: |
          expected="$(python3 scripts/release.py version)"
          docker run --rm --entrypoint python mobofirm:ci -c "from app.version import build_info; i = build_info(); assert i.version == '${expected}', i; assert i.git_sha == '${GITHUB_SHA::7}', i"

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Validate release tag
        run: python scripts/release.py validate-tag "${GITHUB_REF_NAME}"
      - name: Prepare release notes
        run: python scripts/release.py notes "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/release-notes.md"
